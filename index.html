<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股數速算計算機</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="股數計算機">
<style>
  :root {
    box-sizing: border-box;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --sub-text: #6b7280;
    --border: #e5e7eb;
    --accent: #0f766e;
    --accent-bg: #e6f4f1;
    --up: #b91c1c;
    --up-bg: #fef2f2;
    --down: #15803d;
    --down-bg: #f0fdf4;
    --input-bg: #ffffff;
    --header-bg: #f8fafc;
    --highlight-bg: #fffbeb;
    --highlight-border: #f59e0b;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --card-bg: #1e2126;
      --text: #eef0f2;
      --sub-text: #9aa1ac;
      --border: #2e323a;
      --accent: #34d0be;
      --accent-bg: #12302c;
      --up: #f87171;
      --up-bg: #2a1414;
      --down: #4ade80;
      --down-bg: #12271a;
      --input-bg: #262a31;
      --header-bg: #24272d;
      --highlight-bg: #2b2510;
      --highlight-border: #b45309;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --card-bg: #1e2126;
    --text: #eef0f2;
    --sub-text: #9aa1ac;
    --border: #2e323a;
    --accent: #34d0be;
    --accent-bg: #12302c;
    --up: #f87171;
    --up-bg: #2a1414;
    --down: #4ade80;
    --down-bg: #12271a;
    --input-bg: #262a31;
    --header-bg: #24272d;
    --highlight-bg: #2b2510;
    --highlight-border: #b45309;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 4px 0 4px;
  }
  .desc {
    color: var(--sub-text);
    font-size: 0.88rem;
    margin: 0 0 18px;
    line-height: 1.5;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .field-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 6px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 0.82rem;
    color: var(--sub-text);
    font-weight: 600;
  }
  .field input {
    font-size: 1.05rem;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    width: 100%;
    -webkit-appearance: none;
  }
  .field input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .result-box {
    margin-top: 14px;
    background: var(--accent-bg);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  .result-box .label {
    font-size: 0.9rem;
    color: var(--sub-text);
  }
  .result-box .value {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
  }
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: auto;
    max-width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    table-layout: auto;
  }
  thead th {
    background: var(--header-bg);
    color: var(--sub-text);
    font-weight: 600;
    text-align: right;
    padding: 4px 10px 4px 4px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    white-space: nowrap;
    line-height: 1.1;
  }
  thead th:first-child, tbody td:first-child { text-align: left; padding-left: 2px; }
  thead th:last-child, tbody td:last-child { padding-right: 2px; }
  tbody td {
    padding: 1px 10px 1px 4px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.15;
  }
  tr.base-row td {
    background: var(--highlight-bg);
    border-top: 2px solid var(--highlight-border);
    border-bottom: 2px solid var(--highlight-border);
    font-weight: 700;
  }
  .pct-up { color: var(--up); }
  .pct-down { color: var(--down); }
  .section-title {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 22px 0 8px;
  }
  .note {
    font-size: 0.78rem;
    color: var(--sub-text);
    margin-top: 10px;
    line-height: 1.5;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .toggle-row label {
    font-size: 0.82rem;
    color: var(--sub-text);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .card.table-card { padding: 8px 4px; }
  .tables-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .table-col {
    flex: 1 1 0;
    min-width: 0;
  }
  .table-col .section-title { margin: 0 0 6px; font-size: 0.9rem; text-align: center; }
  .table-col table { width: 100%; }
  @media (max-width: 480px) {
    .wrap { padding: 12px 6px 24px; }
    .card { padding: 10px; border-radius: 12px; }
    table { font-size: 0.62rem; }
    thead th { padding: 2px 2px; line-height: 1.05; }
    tbody td { padding: 0.5px 2px; line-height: 1.05; }
    .result-box .value { font-size: 1.2rem; }
    .section-title { margin: 10px 0 4px; font-size: 0.85rem; }
    h1 { font-size: 1.05rem; }
    .desc { margin-bottom: 12px; }
    .tables-row { gap: 3px; }
    .card.table-card { padding: 5px 1px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 股數速算計算機</h1>
  <p class="desc">輸入投資金額與目前股價,自動列出價格上下變動時對應的可購買股數,不必每次手動重算。</p>

  <div class="card">
    <div class="field-row">
      <div class="field">
        <label for="amount">投資金額</label>
        <input id="amount" type="number" inputmode="decimal" value="30000" min="0" step="100">
      </div>
      <div class="field">
        <label for="price">股價</label>
        <input id="price" type="number" inputmode="decimal" value="100" min="0" step="0.01">
      </div>
      <div class="field">
        <label for="stepPct">每級距變動率 (%)</label>
        <input id="stepPct" type="number" inputmode="decimal" value="0.2" min="0.01" step="0.01">
      </div>
      <div class="field">
        <label for="levels">上下各幾級</label>
        <input id="levels" type="number" inputmode="numeric" value="15" min="1" max="50" step="1">
      </div>
    </div>
    <div class="toggle-row">
      <label><input type="checkbox" id="roundLot"> 以「張」為單位取整數(每張1000股)</label>
    </div>

    <div class="result-box">
      <span class="label">目前股價可購買股數</span>
      <span class="value" id="baseQty">300.00 股</span>
    </div>
  </div>

  <div class="tables-row">
    <div class="table-col">
      <div class="section-title">📉 下跌時</div>
      <div class="card table-scroll table-card">
        <table id="downTable">
          <thead>
            <tr><th>幅度</th><th>價格</th><th>股數</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="table-col">
      <div class="section-title">📈 上漲時</div>
      <div class="card table-scroll table-card">
        <table id="upTable">
          <thead>
            <tr><th>幅度</th><th>價格</th><th>股數</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <p class="note">股數 = 投資金額 ÷ 變動後價格。預設不取整數(顯示至小數點後兩位),若勾選「以張為單位取整數」則會無條件捨去至千股倍數,方便下單。此工具僅供試算輔助,不構成投資建議。</p>
</div>

<script>
  const amountEl = document.getElementById('amount');
  const priceEl = document.getElementById('price');
  const stepPctEl = document.getElementById('stepPct');
  const levelsEl = document.getElementById('levels');
  const roundLotEl = document.getElementById('roundLot');
  const baseQtyEl = document.getElementById('baseQty');
  const downBody = document.querySelector('#downTable tbody');
  const upBody = document.querySelector('#upTable tbody');

  function formatQty(qty, roundLot) {
    if (roundLot) {
      const lots = Math.floor(qty / 1000);
      const shares = lots * 1000;
      return shares.toLocaleString('zh-Hant') + ' (' + lots + '張)';
    }
    return qty.toLocaleString('zh-Hant', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function buildRow(pctChange, price, qty, roundLot) {
    const tr = document.createElement('tr');
    const pctClass = pctChange > 0 ? 'pct-up' : (pctChange < 0 ? 'pct-down' : '');
    const pctText = (pctChange > 0 ? '+' : '') + pctChange.toFixed(2) + '%';
    tr.innerHTML = `<td class="${pctClass}">${pctText}</td><td>${price.toFixed(2)}</td><td>${formatQty(qty, roundLot)}</td>`;
    return tr;
  }

  function recalc() {
    const amount = parseFloat(amountEl.value) || 0;
    const basePrice = parseFloat(priceEl.value) || 0;
    const stepPct = parseFloat(stepPctEl.value) || 0.2;
    const levels = Math.max(1, Math.min(50, parseInt(levelsEl.value) || 15));
    const roundLot = roundLotEl.checked;

    downBody.innerHTML = '';
    upBody.innerHTML = '';

    if (basePrice > 0) {
      const baseQty = amount / basePrice;
      baseQtyEl.textContent = formatQty(baseQty, roundLot);
    } else {
      baseQtyEl.textContent = '—';
    }

    for (let i = 1; i <= levels; i++) {
      const pct = -stepPct * i;
      const price = basePrice * (1 + pct / 100);
      if (price <= 0) break;
      const qty = amount / price;
      downBody.appendChild(buildRow(pct, price, qty, roundLot));
    }

    for (let i = 1; i <= levels; i++) {
      const pct = stepPct * i;
      const price = basePrice * (1 + pct / 100);
      if (price <= 0) continue;
      const qty = amount / price;
      upBody.appendChild(buildRow(pct, price, qty, roundLot));
    }
  }

  [amountEl, priceEl, stepPctEl, levelsEl, roundLotEl].forEach(el => {
    el.addEventListener('input', recalc);
  });

  recalc();
</script>
</body>
</html>
